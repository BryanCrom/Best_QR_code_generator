name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"
        cache: "pip"

    - name: Install ruff
      run: pip install ruff

    - name: Run check
      run: ruff check . --output-format=github

    - name: Run format
      run: ruff format . --check



